# php-safepatch advisory file. Both php-safepatch.sh and php-safepatch.ps1 read this format.
# Lines are key=value. Lines that start with '#' are comments.
# To support a new PHP vulnerability, copy this file and change the values.

id=PHP2Shell
cves=CVE-2026-109618 CVE-2026-109619

# Lowest fixed release for each supported branch.
fixed=8.2.35 8.3.36 8.4.27 8.5.12

# End-of-life branches that have upstream source backports or vendor (distribution or LTS) fixes.
eol_backport=7.4 8.0 8.1

# Indicator-of-compromise checks look at files that changed after this date (first exploitation reports).
ioc_since=2026-10-17

# Interim mitigations. Format: mitigate=INI_KEY=VALUE[@MIN_BRANCH]. One rule per line.
# The rule applies only to MIN_BRANCH and newer branches when @MIN_BRANCH is present.
mitigate=session.upload_progress.enabled=0
mitigate=fatal_error_backtraces=0@8.5

# Opt-in mitigations (applied only with --include-optin / -IncludeOptIn).
# memory_limit=-1 blocks the known CVE-2026-109618 path, but it removes the per-request memory cap.
# Use it together with a container, cgroup or FPM pool memory limit.
mitigate_optin=memory_limit=-1

# Log indicators. Format: ioc_log=LABEL|EXTENDED_REGEX. The first "|" separates the label from the regex.
ioc_log=pre-script memory exhaustion errors ('in Unknown on line 0')|Allowed memory size of [0-9]+ bytes exhausted.* in Unknown on line 0
ioc_log=worker segmentation faults|Segmentation fault|SIGSEGV|exited on signal 11
